<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkir System - Junior Cell</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header & Role Selector -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="max-w-md mx-auto flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold flex items-center gap-1.5">
                        🚗 Parkir System <span class="text-xs bg-blue-500 px-2 py-0.5 rounded-full font-normal">Real-Time</span>
                    </h1>
                    <p class="text-xs text-blue-100">Junior Cell Parking Management</p>
                </div>
            </div>
            <div class="bg-blue-700/60 p-2.5 rounded-xl flex items-center justify-between border border-blue-500/40">
                <span class="text-xs font-medium text-blue-100">Login Sebagai:</span>
                <select id="userRoleSelect" onchange="changeUserRole()" class="bg-white text-slate-800 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm focus:outline-none cursor-pointer">
                    <option value="Pos Parkir 1">Pos Parkir 1</option>
                    <option value="Pos Parkir 2">Pos Parkir 2</option>
                    <option value="Pos Parkir 3">Pos Parkir 3</option>
                    <option value="Pos Parkir 4">Pos Parkir 4</option>
                    <option value="Super Admin">Super Admin</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 py-4 flex-grow w-full space-y-4">
        
        <!-- Form Input Kendaraan Masuk -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                ➕ Input Kendaraan Masuk
            </h2>
            <form id="parkingForm" onsubmit="addVehicle(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nomor Plat Kendaraan</label>
                    <input type="text" id="plateNumber" required placeholder="CONTOH: B 1234 XYZ" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm uppercase focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Jenis Kendaraan</label>
                    <select id="vehicleType" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-blue-500">
                        <option value="Motor">Motor</option>
                        <option value="Mobil">Mobil</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Keterangan / Pemilik</label>
                    <input type="text" id="ownerNote" placeholder="Opsional (Nama/Keperluan)" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md">
                    Simpan Kendaraan Masuk
                </button>
            </form>
        </div>

        <!-- Tombol Reset Data (Hanya Muncul untuk Super Admin) -->
        <div id="containerResetBtn" class="hidden">
            <button onclick="resetAllData()" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-xl text-xs transition shadow flex items-center justify-center gap-1">
                🗑️ Reset Seluruh Data Parkir
            </button>
        </div>

        <!-- Daftar Kendaraan Aktif -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                📋 Daftar Kendaraan Aktif
            </h2>
            <input type="text" id="searchPlate" placeholder="Cari Plat Nomor..." onkeyup="filterParkingList()" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-xs uppercase focus:ring-2 focus:ring-blue-500">
            
            <div id="parkingListContainer" class="space-y-2.5 mt-2">
                <p class="text-center text-xs text-slate-400 py-4">Memuat data...</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-3 text-center text-[10px] text-slate-500 mt-6">
        &copy; 2026 Junior Cell - Parkir System Real-Time
    </footer>

    <!-- Firebase Script Configuration & Logic -->
    <script>
        // ==========================================
        // MASUKKAN KREDENSIAL FIREBASE ANDA DI SINI
        // ==========================================
        const firebaseConfig = {
            apiKey: "MASUKKAN_API_KEY_ANDA",
            authDomain: "MASUKKAN_AUTH_DOMAIN_ANDA",
            databaseURL: "MASUKKAN_DATABASE_URL_ANDA",
            projectId: "MASUKKAN_PROJECT_ID_ANDA",
            storageBucket: "MASUKKAN_STORAGE_BUCKET_ANDA",
            messagingSenderId: "MASUKKAN_MESSAGING_SENDER_ID_ANDA",
            appId: "MASUKKAN_APP_ID_ANDA"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const parkingRef = database.ref('parkir_system_data');

        // State Role Pengguna
        let currentRole = localStorage.getItem('parkir_user_role') || 'Pos Parkir 1';
        document.getElementById('userRoleSelect').value = currentRole;
        updateRoleUI();

        function changeUserRole() {
            currentRole = document.getElementById('userRoleSelect').value;
            localStorage.setItem('parkir_user_role', currentRole);
            updateRoleUI();
            if (globalData.length > 0) renderUI(globalData);
        }

        function updateRoleUI() {
            const containerReset = document.getElementById('containerResetBtn');
            if (currentRole === 'Super Admin') {
                containerReset.classList.remove('hidden');
            } else {
                containerReset.classList.add('hidden');
            }
        }

        // Tambah Kendaraan
        function addVehicle(event) {
            event.preventDefault();
            const plateNumber = document.getElementById('plateNumber').value.trim().toUpperCase();
            const vehicleType = document.getElementById('vehicleType').value;
            const ownerNote = document.getElementById('ownerNote').value.trim();
            const entryTime = new Date().toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'medium' });

            const newVehicle = {
                plateNumber,
                vehicleType,
                ownerNote: ownerNote || '-',
                entryTime,
                position: currentRole,
                status: 'Aktif',
                timestamp: Date.now()
            };

            parkingRef.push(newVehicle).then(() => {
                document.getElementById('parkingForm').reset();
                alert('Kendaraan berhasil disimpan!');
            }).catch((err) => {
                alert('Gagal menyimpan: ' + err.message);
            });
        }

        // Realtime Data Listener
        let globalData = [];
        parkingRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                globalData = [];
                renderUI([]);
                return;
            }
            globalData = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            globalData.sort((a, b) => b.timestamp - a.timestamp);
            renderUI(globalData);
        });

        function renderUI(dataList) {
            const container = document.getElementById('parkingListContainer');
            container.innerHTML = '';

            if (dataList.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-400 py-4">Belum ada kendaraan aktif.</p>`;
                return;
            }

            dataList.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col gap-1.5";

                // Tombol Hapus Satuan: HANYA MUNCUL JIKA SUPER ADMIN
                let deleteButtonHtml = '';
                if (currentRole === 'Super Admin') {
                    deleteButtonHtml = `<button onclick="deleteVehicle('${item.id}')" class="text-red-600 hover:text-red-700 font-semibold text-xs ml-auto">Hapus</button>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-bold text-slate-800 text-sm">${item.plateNumber}</span>
                            <span class="ml-2 px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-[10px] font-medium">${item.vehicleType}</span>
                            <span class="ml-1 px-2 py-0.5 bg-slate-200 text-slate-700 rounded text-[10px]">${item.position}</span>
                        </div>
                        <span class="text-xs text-slate-500">${item.entryTime}</span>
                    </div>
                    <p class="text-xs text-slate-600">Ket: ${item.ownerNote}</p>
                    <div class="flex items-center pt-1 border-t border-slate-200 text-xs">
                        <span class="text-emerald-600 font-medium">Status: Aktif</span>
                        ${deleteButtonHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Filter Pencarian Plat
        function filterParkingList() {
            const keyword = document.getElementById('searchPlate').value.toUpperCase();
            const filtered = globalData.filter(item => item.plateNumber.includes(keyword));
            renderUI(filtered);
        }

        // Hapus Satuan (Super Admin Only)
        function deleteVehicle(id) {
            if (currentRole !== 'Super Admin') {
                alert('Akses ditolak! Hanya Super Admin.');
                return;
            }
            if (confirm('Hapus data kendaraan ini?')) {
                parkingRef.child(id).remove().catch(err => alert('Gagal: ' + err.message));
            }
        }

        // Reset Semua Data (Super Admin Only)
        function resetAllData() {
            if (currentRole !== 'Super Admin') {
                alert('Akses ditolak! Hanya Super Admin.');
                return;
            }
            if (confirm('PERINGATAN: Semua data parkir akan dihapus permanen!')) {
                parkingRef.remove().then(() => {
                    alert('Data berhasil direset.');
                }).catch(err => alert('Gagal: ' + err.message));
            }
        }
    </script>
</body>
</html>
